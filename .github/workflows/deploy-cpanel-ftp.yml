name: Deploy PHP site to cPanel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "cpanel-production"
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and publish
    runs-on: windows-latest
    env:
      CPANEL_DEPLOY_READY: ${{ secrets.CPANEL_FTP_SERVER != '' && secrets.CPANEL_FTP_USERNAME != '' && secrets.CPANEL_FTP_PASSWORD != '' && secrets.CPANEL_FTP_SERVER_DIR != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Validate project
        run: npm run check

      - name: Skip publish until cPanel secrets exist
        if: env.CPANEL_DEPLOY_READY != 'true'
        run: echo "cPanel FTP secrets are not configured yet. Validation passed, publish skipped."

      - name: Publish files by FTPS
        if: env.CPANEL_DEPLOY_READY == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.openai/**
            **/.tools/**
            **/node_modules/**
            **/dist/**
            **/*.zip
            includes/config.php
            uploads/cupons/**
            estrategia-google-ads-longtail.txt
